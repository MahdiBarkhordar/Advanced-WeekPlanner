<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="Hello in six languages" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#5b7cff"/><stop offset="1" stop-color="#ff5fa2"/></linearGradient></defs>
<g font-family="'Segoe UI',Tahoma,Arial,sans-serif" text-anchor="middle" font-weight="800" font-size="64" fill="url(#g)">
<text x="450" y="85" opacity="0">سلام<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.000;0.020;0.147;0.167;1" dur="12s" repeatCount="indefinite"/></text>
<text x="450" y="85" opacity="0">Hello<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.167;0.187;0.313;0.333;1" dur="12s" repeatCount="indefinite"/></text>
<text x="450" y="85" opacity="0">Bonjour<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.353;0.480;0.500;1" dur="12s" repeatCount="indefinite"/></text>
<text x="450" y="85" opacity="0">مرحبا<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.520;0.647;0.667;1" dur="12s" repeatCount="indefinite"/></text>
<text x="450" y="85" opacity="0">Привет<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.667;0.687;0.813;0.833;1" dur="12s" repeatCount="indefinite"/></text>
<text x="450" y="85" opacity="0">你好<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.833;0.853;0.980;1.000;1" dur="12s" repeatCount="indefinite"/></text>
</g>
<g font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#888" text-anchor="middle" letter-spacing="2"><text x="450" y="130">FA · EN · FR · AR · RU · ZH</text></g>
</svg>
