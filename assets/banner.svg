<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Advance Week Planner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#4c3fe0"><animate attributeName="stop-color" values="#4c3fe0;#9b5cff;#ff5fa2;#4c3fe0" dur="12s" repeatCount="indefinite"/></stop>
<stop offset="1" stop-color="#14b8c4"><animate attributeName="stop-color" values="#14b8c4;#5b7cff;#7be0c3;#14b8c4" dur="12s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ffd1e8"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
<clipPath id="r"><rect width="1200" height="340" rx="28"/></clipPath>
</defs>
<g clip-path="url(#r)">
<rect width="1200" height="340" fill="url(#bg)"/>
<g filter="url(#blur)" opacity=".55">
<circle r="90" fill="#ff5fa2"><animate attributeName="cx" values="150;350;150" dur="9s" repeatCount="indefinite"/><animate attributeName="cy" values="80;260;80" dur="7s" repeatCount="indefinite"/></circle>
<circle r="110" fill="#7be0c3"><animate attributeName="cx" values="650;520;650" dur="11s" repeatCount="indefinite"/><animate attributeName="cy" values="280;70;280" dur="8s" repeatCount="indefinite"/></circle>
<circle r="80" fill="#ffd60a"><animate attributeName="cx" values="1000;900;1000" dur="10s" repeatCount="indefinite"/><animate attributeName="cy" values="60;250;60" dur="9s" repeatCount="indefinite"/></circle>
</g>
<g fill="#fff" opacity=".7"><circle cx="90" cy="60" r="2"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle><circle cx="420" cy="290" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="1s" repeatCount="indefinite"/></circle><circle cx="610" cy="40" r="2"><animate attributeName="opacity" values="0;1;0" dur="3.5s" begin="2s" repeatCount="indefinite"/></circle><circle cx="1150" cy="300" r="2"><animate attributeName="opacity" values="0;1;0" dur="5s" begin=".5s" repeatCount="indefinite"/></circle></g>

<g font-family="'Segoe UI',Helvetica,Arial,sans-serif" fill="#fff">
<g>
<animateTransform attributeName="transform" type="translate" values="-40 0;0 0" dur="1s" fill="freeze"/>
<animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
<text x="60" y="150" font-size="68" font-weight="800" letter-spacing="-1">Advance</text>
<text x="60" y="220" font-size="68" font-weight="800" letter-spacing="-1">Week Planner</text>
</g>
<g font-size="22" opacity=".95">
<text x="62" y="272">Glassmorphic planner + focus timer
<animate attributeName="opacity" values="0;1;1;0;0;0;0" keyTimes="0;.05;.28;.33;.66;.99;1" dur="9s" repeatCount="indefinite"/></text>
<text x="62" y="272">6 languages · full RTL · 11+ themes
<animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;.32;.34;.40;.62;.67;1" dur="9s" repeatCount="indefinite"/></text>
<text x="62" y="272">One HTML file · zero dependencies
<animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;.65;.67;.72;.95;1" dur="9s" repeatCount="indefinite"/></text>
</g>
</g>

<g transform="translate(700 40)">
<animateTransform attributeName="transform" type="translate" values="700 40;700 32;700 40" dur="5s" repeatCount="indefinite"/>
<rect width="440" height="260" rx="26" fill="#fff" fill-opacity=".16" stroke="#fff" stroke-opacity=".6" stroke-width="1.5"/>
<g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
<rect x="18" y="18" width="46" height="30" rx="10" fill="#fff" fill-opacity=".12"/><text x="41" y="38">Sat</text>
<rect x="70" y="18" width="46" height="30" rx="10" fill="#fff" fill-opacity=".12"/><text x="93" y="38">Sun</text>
<rect x="122" y="18" width="46" height="30" rx="10" fill="#fff" fill-opacity=".12"/><text x="145" y="38">Mon</text>
<rect x="174" y="18" width="46" height="30" rx="10" fill="#fff" fill-opacity=".42"><animate attributeName="fill-opacity" values=".42;.7;.42" dur="3s" repeatCount="indefinite"/></rect><text x="197" y="38">Tue</text>
<rect x="226" y="18" width="46" height="30" rx="10" fill="#fff" fill-opacity=".12"/><text x="249" y="38">Wed</text>
</g>
<rect x="18" y="64" width="270" height="8" rx="4" fill="#fff" fill-opacity=".2"/>
<rect x="18" y="64" width="0" height="8" rx="4" fill="#fff"><animate attributeName="width" values="0;270;270;0" keyTimes="0;.6;.9;1" dur="8s" repeatCount="indefinite"/></rect>
<g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#fff" font-weight="600">
<g transform="translate(18 90)"><rect width="270" height="44" rx="14" fill="#fff" fill-opacity=".14"/><circle cx="24" cy="22" r="10" fill="none" stroke="#fff" stroke-width="2"/><path d="M19 22l4 4 7-8" fill="none" stroke="#7bffc9" stroke-width="3" stroke-linecap="round" stroke-dasharray="20" stroke-dashoffset="20"><animate attributeName="stroke-dashoffset" values="20;20;0;0;20" keyTimes="0;.1;.2;.9;1" dur="8s" repeatCount="indefinite"/></path><text x="46" y="27">Design review</text><text x="258" y="27" text-anchor="end" font-size="12" opacity=".8">09:00–10:00</text></g>
<g transform="translate(18 142)"><rect width="270" height="44" rx="14" fill="#fff" fill-opacity=".14"/><circle cx="24" cy="22" r="10" fill="none" stroke="#fff" stroke-width="2"/><path d="M19 22l4 4 7-8" fill="none" stroke="#7bffc9" stroke-width="3" stroke-linecap="round" stroke-dasharray="20" stroke-dashoffset="20"><animate attributeName="stroke-dashoffset" values="20;20;0;0;20" keyTimes="0;.3;.4;.9;1" dur="8s" repeatCount="indefinite"/></path><text x="46" y="27">Deep work</text><text x="258" y="27" text-anchor="end" font-size="12" opacity=".8">10:30–12:00</text></g>
<g transform="translate(18 194)"><rect width="270" height="44" rx="14" fill="#fff" fill-opacity=".14"/><circle cx="24" cy="22" r="10" fill="none" stroke="#fff" stroke-width="2"/><path d="M19 22l4 4 7-8" fill="none" stroke="#7bffc9" stroke-width="3" stroke-linecap="round" stroke-dasharray="20" stroke-dashoffset="20"><animate attributeName="stroke-dashoffset" values="20;20;0;0;20" keyTimes="0;.5;.6;.9;1" dur="8s" repeatCount="indefinite"/></path><text x="46" y="27">Ship the release</text><text x="258" y="27" text-anchor="end" font-size="14" fill="#ffd60a">★</text></g>
</g>
<g transform="translate(360 135)">
<circle r="52" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="10"/>
<circle r="52" fill="none" stroke="url(#ring)" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.7" transform="rotate(-90)"><animate attributeName="stroke-dashoffset" values="0;326.7" dur="8s" repeatCount="indefinite"/></circle>
<text y="8" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#fff">25:00</text>
<text y="78" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff" opacity=".85" letter-spacing="2">FOCUS</text>
</g>
</g>
</g>
</svg>
